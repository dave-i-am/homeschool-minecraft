services:
  minecraft-survival:
    image: itzg/minecraft-server
    ports:
      - ${SURVIVAL_GAME_PORT}:25565
      - ${SURVIVAL_RCON_PORT}:25575
    volumes:
      - ./data/survival:/data
      - ./shared-config/whitelist.json:/data/whitelist.json
      - ./shared-config/ops.json:/data/ops.json
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      ENABLE_ROLLING_LOGS: "true"
      MEMORY: "2G"
      TZ: ${TZ}
      VERSION: ${SURVIVAL_VERSION}
      RCON_PASSWORD: ${RCON_PASSWORD}
      RCON_CMDS_ON_CONNECT: ${SURVIVAL_RCON_CMDS_ON_CONNECT}
      MODRINTH_PROJECTS: |
        advancedsensitivewords:Eh9FhiuS
        advancedteleport
        coreprotect
        discordsrv
        griefprevention:ue7jAjJ5
        luckperms
        multiverse-core:4.3.16
        multiverse-portals:4.2.3
        smoderation
        vaultunlocked
        viaversion
        worldedit
        worldguard
    restart: unless-stopped

  alerts-survival:
    build: ./alerts
    environment:
      ALERTS_WEBHOOK: ${ALERTS_WEBHOOK}
      ALERTS_FILE: ${ALERTS_FILE}
    volumes:
      - ./data/survival:/data:ro
    depends_on:
      - minecraft-survival
    restart: unless-stopped

  backups-survival:
    image: itzg/mc-backup
    environment:
      BACKUP_METHOD: restic
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      RCON_HOST: minecraft-survival
      RCON_PASSWORD: ${RCON_PASSWORD}
      TZ: ${TZ}
      RESTIC_REPOSITORY: /backups/survival
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      PRUNE_RESTIC_RETENTION: ${PRUNE_RESTIC_RETENTION}
    volumes:
      - ./data/survival:/data:ro
      - nfs-backups:/backups
    mem_limit: 3g
    cpus: 1
    depends_on:
      - minecraft-survival
    restart: unless-stopped

  minecraft-creative:
    image: itzg/minecraft-server
    ports:
      - "25566:25565"
      - "25576:25575"
    volumes:
      - ./data/creative:/data
      - ./shared-config/whitelist.json:/data/whitelist.json
      - ./shared-config/ops.json:/data/ops.json
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      ENABLE_ROLLING_LOGS: "true"
      MEMORY: "2G"
      TZ: ${TZ}
      VERSION: ${CREATIVE_VERSION}
      RCON_PASSWORD: ${RCON_PASSWORD}
      RCON_CMDS_ON_CONNECT: ${CREATIVE_RCON_CMDS_ON_CONNECT}
      MODRINTH_PROJECTS: |
        advancedsensitivewords:Eh9FhiuS
        advancedteleport
        coreprotect
        discordsrv
        griefprevention:ue7jAjJ5
        luckperms
        multiverse-core:4.3.16
        multiverse-portals:4.2.3
        smoderation
        vaultunlocked
        viaversion
        worldedit
        worldguard
    restart: unless-stopped

  alerts-creative:
    build: ./alerts
    environment:
      ALERTS_WEBHOOK: ${ALERTS_WEBHOOK}
      ALERTS_FILE: ${ALERTS_FILE}
    volumes:
      - ./data/creative:/data:ro
    depends_on:
      - minecraft-creative
    restart: unless-stopped

  backups-creative:
    image: itzg/mc-backup
    environment:
      BACKUP_METHOD: restic
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      RCON_HOST: minecraft-creative
      RCON_PASSWORD: ${RCON_PASSWORD}
      TZ: ${TZ}
      RESTIC_REPOSITORY: /backups/creative
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      PRUNE_RESTIC_RETENTION: ${PRUNE_RESTIC_RETENTION}
    volumes:
      - ./data/creative:/data:ro
      - nfs-backups:/backups
    mem_limit: 2g
    cpus: 1
    depends_on:
      - minecraft-creative
    restart: unless-stopped

  pvp-reset:
    build: ./world-reset
    environment:
      RCON_HOST: minecraft-survival
      RCON_PASSWORD: ${RCON_PASSWORD}
      WORLD_TO_RESET: pvp
      RESET_INTERVAL_SECONDS: 300
    volumes:
      - ./data/survival:/data
    depends_on:
      - minecraft-survival
    restart: unless-stopped

volumes:
  nfs-backups:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER_ADDRESS},rw,nfsvers=3"
      device: ":${NFS_SHARE}"
